[project]
name = "tracksplit"
version = "0.1.0"
description = "Chop DJ set VODs into per-song clips: music gate -> ACRCloud fingerprint -> segment -> ffmpeg cut -> triage TUI"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "soundfile",
    "librosa",
    "torch",
    "panns-inference",
    "requests",
    "textual",
    "tomli; python_version < '3.11'",
]

[project.scripts]
tracksplit = "tracksplit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracksplit"]
